---
- name: Production Deployment Pipeline for Azure Go Serverless
  hosts: localhost
  connection: local
  vars:
    src_dir: "{{ playbook_dir }}/../src"
    build_dir: "{{ playbook_dir }}/../build"
    package_dir: "{{ playbook_dir }}/../build/package"
    zip_file: "{{ playbook_dir }}/../build/app.zip"
    infra_dir: "{{ playbook_dir }}/../infra"

  tasks:
    # 1. Чтение Outputs из Terraform
    - name: Fetch Infrastructure outputs from Terraform
      community.general.terraform:
        project_path: "{{ infra_dir }}"
        state: present
      register: tf_out
      check_mode: false

    - name: Set facts from Terraform
      ansible.builtin.set_fact:
        resource_group: "{{ tf_out.outputs.resource_group_name.value }}"
        function_app_name: "{{ tf_out.outputs.function_app_name.value }}"

    # 2. Подготовка папки сборки
    - name: Ensure artifact directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ build_dir }}"
        - "{{ package_dir }}"

    # 3. Сборка Linux-бинарника Go
    - name: Compile Go binary for Linux Architecture (CGO_ENABLED=0)
      ansible.builtin.command:
        cmd: go build -o "{{ package_dir }}/main" .
        chdir: "{{ src_dir }}"
      environment:
        GOOS: "linux"
        GOARCH: "amd64"
        CGO_ENABLED: "0"

    # Custom handler must be executable inside the zip (Linux mount is read-only)
    - name: Ensure custom handler binary is executable
      ansible.builtin.file:
        path: "{{ package_dir }}/main"
        mode: "0755"

    - name: Copy host.json into package root
      ansible.builtin.copy:
        src: "{{ src_dir }}/host.json"
        dest: "{{ package_dir }}/host.json"
        mode: "0644"

    - name: Copy function folder into package root
      ansible.builtin.copy:
        src: "{{ src_dir }}/hello"
        dest: "{{ package_dir }}/"
        mode: "0644"

    # 4. Упаковка артефактов деплоя (файлы в корне zip: main, host.json, hello/)
    - name: Create Zip Deployment package
      ansible.builtin.command:
        cmd: zip -r "{{ zip_file }}" .
        chdir: "{{ package_dir }}"

    # 5. Деплой через Azure CLI (используем outputs Terraform, не хардкод)
    - name: Deploy package to Azure Function App
      ansible.builtin.command:
        cmd: >
          az functionapp deployment source config-zip
          --resource-group {{ resource_group }}
          --name {{ function_app_name }}
          --src {{ zip_file }}
          --timeout 600
      register: deploy_output

    - name: Show deploy result
      ansible.builtin.debug:
        var: deploy_output.stdout

    # 6. E2E / Smoke Testing
    - name: Validate Deployment via HTTP Smoke Test
      ansible.builtin.uri:
        url: "https://{{ function_app_name }}.azurewebsites.net/api/hello"
        method: GET
        status_code: 200
        return_content: true
      register: http_response
      retries: 12
      delay: 15
      until: http_response.status == 200

    - name: Print Output Response
      ansible.builtin.debug:
        msg: "Endpoint verified successfully. Payload: {{ http_response.json }}"
