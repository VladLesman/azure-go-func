---
- name: Production Deployment Pipeline for Azure Go Serverless
  hosts: localhost
  connection: local
  vars:
    src_dir: "{{ playbook_dir }}/../src"
    build_dir: "{{ playbook_dir }}/../build"
    package_dir: "{{ playbook_dir }}/../build/package"
    zip_file: "{{ playbook_dir }}/../build/app.zip"
    infra_dir: "{{ playbook_dir }}/../infra"
    # Blob name changes each run so Function App picks up a new package URL
    package_blob_name: "app-{{ ansible_facts['date_time']['iso8601_basic_short'] }}.zip"

  tasks:
    # 1. Чтение Outputs из Terraform
    - name: Fetch Infrastructure outputs from Terraform
      community.general.terraform:
        project_path: "{{ infra_dir }}"
        state: present
      register: tf_out
      check_mode: false

    - name: Set facts from Terraform
      ansible.builtin.set_fact:
        resource_group: "{{ tf_out.outputs.resource_group_name.value }}"
        function_app_name: "{{ tf_out.outputs.function_app_name.value }}"
        storage_account_name: "{{ tf_out.outputs.storage_account_name.value }}"
        storage_account_key: "{{ tf_out.outputs.storage_account_primary_access_key.value }}"
        deployments_container: "{{ tf_out.outputs.deployments_container_name.value }}"

    # 2. Подготовка папки сборки
    - name: Ensure artifact directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ build_dir }}"
        - "{{ package_dir }}"

    - name: Clean previous package directory contents
      ansible.builtin.file:
        path: "{{ package_dir }}"
        state: absent

    - name: Recreate package directory
      ansible.builtin.file:
        path: "{{ package_dir }}"
        state: directory
        mode: "0755"

    # 3. Сборка Linux-бинарника Go
    - name: Compile Go binary for Linux Architecture (CGO_ENABLED=0)
      ansible.builtin.command:
        cmd: go build -o "{{ package_dir }}/main" .
        chdir: "{{ src_dir }}"
      environment:
        GOOS: "linux"
        GOARCH: "amd64"
        CGO_ENABLED: "0"

    - name: Ensure custom handler binary is executable
      ansible.builtin.file:
        path: "{{ package_dir }}/main"
        mode: "0755"

    - name: Copy host.json into package root
      ansible.builtin.copy:
        src: "{{ src_dir }}/host.json"
        dest: "{{ package_dir }}/host.json"
        mode: "0644"

    - name: Copy function folder into package root
      ansible.builtin.copy:
        src: "{{ src_dir }}/hello"
        dest: "{{ package_dir }}/"
        mode: "0644"

    # 4. Упаковка (корень zip: main, host.json, hello/)
    - name: Create Zip Deployment package
      ansible.builtin.command:
        cmd: zip -r "{{ zip_file }}" .
        chdir: "{{ package_dir }}"

    # 5. Linux Consumption: upload zip to blob + set WEBSITE_RUN_FROM_PACKAGE=<URL>
    #    az functionapp deployment source config-zip often returns 400 Bad Request on Y1
    #    when runtime detection fails — blob URL deploy is the supported path.
    - name: Upload package to Azure Blob Storage
      ansible.builtin.command:
        argv:
          - az
          - storage
          - blob
          - upload
          - --account-name
          - "{{ storage_account_name }}"
          - --account-key
          - "{{ storage_account_key }}"
          - --container-name
          - "{{ deployments_container }}"
          - --name
          - "{{ package_blob_name }}"
          - --file
          - "{{ zip_file }}"
          - --overwrite
          - "true"
      register: blob_upload

    - name: Generate read SAS URL for package (1 year)
      ansible.builtin.command:
        argv:
          - az
          - storage
          - blob
          - generate-sas
          - --account-name
          - "{{ storage_account_name }}"
          - --account-key
          - "{{ storage_account_key }}"
          - --container-name
          - "{{ deployments_container }}"
          - --name
          - "{{ package_blob_name }}"
          - --permissions
          - r
          - --https-only
          - --expiry
          - "{{ '%Y-%m-%dT%H:%MZ' | strftime((ansible_facts['date_time']['epoch'] | int) + 31536000) }}"
          - --full-uri
          - --output
          - tsv
      register: package_sas

    - name: Set package URL fact (strip accidental quotes)
      ansible.builtin.set_fact:
        package_url: "{{ package_sas.stdout | trim | regex_replace('^\"|\"$', '') }}"

    - name: Set WEBSITE_RUN_FROM_PACKAGE to blob SAS URL
      ansible.builtin.command:
        argv:
          - az
          - functionapp
          - config
          - appsettings
          - set
          - --resource-group
          - "{{ resource_group }}"
          - --name
          - "{{ function_app_name }}"
          - --settings
          - "WEBSITE_RUN_FROM_PACKAGE={{ package_url }}"
      register: deploy_output

    - name: Restart Function App to mount new package
      ansible.builtin.command:
        argv:
          - az
          - functionapp
          - restart
          - --resource-group
          - "{{ resource_group }}"
          - --name
          - "{{ function_app_name }}"

    - name: Show deploy package URL host (no SAS secrets)
      ansible.builtin.debug:
        msg: "Deployed blob {{ package_blob_name }} to {{ function_app_name }}"

    # 6. E2E / Smoke Testing
    - name: Validate Deployment via HTTP Smoke Test
      ansible.builtin.uri:
        url: "https://{{ function_app_name }}.azurewebsites.net/api/hello"
        method: GET
        status_code: 200
        return_content: true
      register: http_response
      retries: 18
      delay: 15
      until: http_response.status == 200

    - name: Print Output Response
      ansible.builtin.debug:
        msg: "Endpoint verified successfully. Payload: {{ http_response.json }}"
